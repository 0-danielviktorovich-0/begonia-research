name: Multilingual documentation integrity

on:
  push:
    branches: [main]
    paths:
      - 'i18n/**'
      - 'docs/**'
      - 'data/**'
      - '_context/**'
      - 'README.md'
      - 'NOTICE.md'
      - 'tools/check_i18n.py'
      - 'tools/audit_repository.py'
      - 'archive/**'
      - '.github/workflows/i18n-check.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python version
        run: python3 --version
      - name: Validate bilingual references and source revisions
        run: python3 tools/check_i18n.py
      - name: Audit local links, section anchors, tables, and catalogs
        run: python3 tools/audit_repository.py
      - name: Verify original Git content survived the migration
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 4
        run: python3 tools/audit_repository.py --migration
